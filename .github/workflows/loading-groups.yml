name: Baseline groups
on:
  - push
  - pull_request
  - workflow_dispatch
jobs:
   group-loading:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        load-spec:
          - development
          - dependent-sunit-extensions
          - deployment
          - tests
          - tools
    steps:
      - uses: ./.github/workflows/loading-pharo-group.yml
        with:
          load-spec: ${{ matrix.load-spec }}
